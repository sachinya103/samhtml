ton",{onClick:e,className:"flex items-center gap-2 px-5 py-3 rounded-full bg-rose-950/70 hover:bg-rose-900/70 text-rose-200 text-xs font-cinzel tracking-wider uppercase border border-rose-500/30 hover:border-amber-400/50 transition-all duration-300 hover:scale-105",children:[u.jsx("span",{children:"Explore Chapters"}),u.jsx(ca,{className:"h-3.5 w-3.5 text-amber-300"})]})]}),u.jsxs("div",{onClick:e,className:"mt-14 cursor-pointer flex flex-col items-center gap-1.5 text-rose-400/70 hover:text-amber-200 transition-colors animate-bounce",children:[u.jsx("span",{className:"text-[10px] font-cinzel uppercase tracking-widest text-rose-300/80",children:"Scroll Down To Unfold The Story"}),u.jsx(ca,{className:"h-3.5 w-3.5 text-amber-400"})]})]})},eh=()=>{const e=[{number:"01",roman:"I",title:"Wo Pehli Mulaqat",subtitle:"Jab inquiry ke liye aana aur dil me bas jana...",tag:"The First Glimpse",marker:"Uss Din Se Aaj Tak",icon:u.jsx(kn,{className:"h-5 w-5 text-amber-300"}),poetry:["Aap aayi thi ek mamuli si inquiry ke liye dost ke sath,","Par hamari qismat me jud gayi ek anokhi baat.","Chehre par wo saadgi, aankhon me wo chamak thi,","Bas ek nazar me hi dil me utar jaane ki mehak thi."],description:"Wo pehla din jab aap apni dost ke sath us inquiry ke liye aayi thi... Us pal ka ehsaas aaj bhi dil me utna hi taaza hai. Ek aam sa din achanak se mere liye meri zindagi ka sabse yaadgaar pal ban gaya. Bas ek jhalak, aur aap hamesha ke liye dimag me bas gayi.",reflection:"Some moments are destined to rewrite entire seasons of our lives. The moment you walked in, the world outside quietly faded."},{number:"02",roman:"II",title:"Class Ke Wo Khubsoorat Pal",subtitle:"Time se pehle aana, choti baatein, aur har roz ka intezar...",tag:"Anticipation & Joy",marker:"Har Subah Ka Intezar",icon:u.jsx(Ip,{className:"h-5 w-5 text-rose-400"}),poetry:["Class ke waqt se pehle pohnch kar baith jaana,","Aapke aane ki aahat par dil ka yun muskurana.","Chhoti chhoti baatein jo roz ka silsila ban gayi,","Aapke deedar ki umeed hamari roz ki wajah ban gayi."],description:"Jab aapne regular class join ki, to jaise din ka sabse khoobsurat hissa tay ho gaya. Class ke waqt se pehle aakar sirf is khushi me baithna ki aap aane wali hain. Wo chhoti chhoti baatein, wo choti si muskurahtein... un sab ne har subah ko ek umeed aur roshni se bhar diya tha.",reflection:"Rushing ahead of time just to see you arrive, treasuring every single second of gentle, innocent conversation."},{number:"03",roman:"III",title:"Sukun Aur Khamoshi",subtitle:"Practical class me chupke se dekhna, aapki presence ka sukun...",tag:"Quiet Serenity",marker:"Class Ki Khamoshi",icon:u.jsx(Tc,{className:"h-5 w-5 text-amber-200"}),poetry:["Practical class ke shor me bhi ek ajeeb sa sukun tha,","Aapka pass hona hi hamare sukun ka junoon tha.","Chupke se ek nazar dekh kar nazarein jhuka lena,","Aapki khushbu aur maujoodgi ko dil me basa lena."],description:"Practical classes me jab har koi apne kam me laga hota tha, tab aapki maujoodgi pure kamre ko ek alag hi noor aur shanti deti thi. Bina kisi shor ke, bina kisi zidd ke, bas aapka aas-paas hona hi dil ko beinteha sukun aur itminaan de deta tha.",reflection:"In the midst of everyday commotion, your mere presence brought a peaceful calm that words fail to capture."},{number:"04",roman:"IV",title:"Dil Ki Khwahish Aur Darr",subtitle:"Lambi baatein karne ka khwab, par darr ki kahin baat na bigad jaye...",tag:"Vulnerability & Care",marker:"Ek Dil Ki Fariyaad",icon:u.jsx(Up,{className:"h-5 w-5 text-rose-300"}),poetry:["Dil to karta hai aapse ghanto baatein karein,","Par darr lagta hai kahin lafzon se khamoshi na toote.","Nazarein milane me jo ek masoom si jhijhak hai,","Kahin hamari kisi baat se aapka sukun na roothe."],description:"Dil me hamesha ek khwahish rehti hai ki aapse khulkar baatein karein, dhero baatein share karein. Lekin sath hi dil me ek adab aur darr bhi rehta hai—kahin meri kisi baat se aap uncomfortable na ho jayein, ya kahin mere lafzon se hamari
